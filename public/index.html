<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Biblioteca</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">Biblioteca personal</p>
      <h1>Libros</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="app-view" class="hidden">
      <header>
        <div><p class="eyebrow">Vanilla JS · Mongo</p><h1>Biblioteca</h1></div>
        <div class="who"><strong id="user-name"></strong><button id="logout" class="ghost" type="button">Salir</button></div>
      </header>
      <form id="book-form" class="card form">
        <input id="title" placeholder="Titulo" maxlength="120" required />
        <input id="author" placeholder="Autor" maxlength="80" />
        <select id="status"><option value="por-leer">Por leer</option><option value="leyendo">Leyendo</option><option value="leido">Leido</option></select>
        <select id="rating"><option value="0">Sin rating</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
        <input id="note" placeholder="Nota" maxlength="240" />
        <div class="row"><button class="primary" type="submit">Guardar</button><button id="cancel" class="ghost" type="button" hidden>Cancelar</button><button id="remove" class="danger" type="button" hidden>Borrar</button></div>
      </form>
      <p id="form-error" class="error" hidden></p>
      <div class="tools"><input id="search" type="search" placeholder="Buscar titulo o autor" /><nav id="filters"></nav></div>
      <ul id="list"></ul>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
